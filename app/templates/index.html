{% extends 'base.html' %}


{% block title %}Главная страниица{% endblock %}

{% block content %}
    <div class="news-div">
        <h1 class="news-title">Новости</h1>
        {% for post in posts %}
        <div class="news-item">
            <h2 class="news-item-title">{{ post.title }}</h2>
            <p class="news-item-text">{{ post.content }}</p>
        </div>
        {% else %}
        <h2>Пост не сушествует</h2>
        {% endfor  %}

    </div>



{% endblock %}
